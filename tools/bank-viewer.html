  .tabs button { border: 1px solid var(--border); background: var(--card); color: var(--ink);
    padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; }
  .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .toolbar input[type=search] { flex: 1; min-width: 200px; border: 1px solid var(--border); background: var(--card);
    color: var(--ink); border-radius: 999px; padding: 8px 16px; font-size: 14px; outline: none; }
  .toolbar select { border: 1px solid var(--border); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 7px 12px; font-size: 13px; }
  .chapters { max-width: 980px; margin: 12px auto 0; padding: 0 20px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chapters button { border: 1px solid var(--border); background: var(--chip); color: var(--ink);
    padding: 5px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; }
  .chapters button.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  main { max-width: 980px; margin: 18px auto 60px; padding: 0 20px; display: grid; gap: 14px; }
  .problem { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; }
  .problem-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .problem-head h2 { margin: 0; font-size: 16px; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 12px; }
  .badge { background: var(--chip); border-radius: 6px; padding: 2px 8px; color: var(--sub); }
  .badge.exam { background: var(--accent-soft); color: var(--accent); }
  .badge.builtin { background: transparent; border: 1px dashed var(--border); }
  .meta { color: var(--sub); font-size: 12px; margin: 8px 0 10px; display: flex; gap: 10px; flex-wrap: wrap; }
  .question { font-size: 15px; line-height: 1.8; }
  details.answer { margin-top: 10px; }
  details.answer summary { cursor: pointer; color: var(--accent); font-size: 13px; user-select: none; }
  details.answer .answer-body { border-top: 1px dashed var(--border); margin-top: 8px; padding-top: 8px; font-size: 15px; line-height: 1.8; }
  .katex-display { overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
  .empty { text-align: center; color: var(--sub); padding: 48px 0; }
  footer { text-align: center; color: var(--sub); font-size: 12px; padding: 0 0 40px; }
  @media print {
    body { background: #fff; }
    .toolbar, .chapters, .tabs { display: none; }
    details.answer { open: true; }
    details.answer summary { display: none; }
    details.answer .answer-body { display: block !important; }
    .problem { break-inside: avoid; border-color: #ccc; }
  }

,"answerText":"按第一行展开：$$D=1\\cdot(3\\cdot7-4\\cdot5)-2\\cdot(2\\cdot7-4\\cdot3)+3\\cdot(2\\cdot5-3\\cdot3)=1-4+3=0$$ 事实上第二行减第一行、第三行减第二行后得两行相同，也可直接判断 $D=0$。","questionImages":[],"answerImages":[],"primaryChapterId":"la.chapter.determinants","secondaryChapterIds":[],"primaryProblemTypeId":"la.problem_type.determinant_computation","secondaryProblemTypeIds":[],"knowledgePointIds":["la.knowledge.row_column_expansion","la.knowledge.determinant_properties"],"methodIds":["la.method.row_column_expansion"],"notes":"机制验证示例题（题目为项目自编，非真实真题）","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":1,"source":{"kind":"example","book":"Hefferon, Linear Algebra","section":"Determinants","license":"GFDL / CC BY-SA 3.0"}},{"id":"bank.la.3","title":"二次型正定性的判定","questionText":"判断二次型 $f(x_{1},x_{2},x_{3})=x_{1}^{2}+2x_{2}^{2}+3x_{3}^{2}+2x_{1}x_{2}+2x_{1}x_{3}$ 是否正定。","answerText":"$f$ 的矩阵为 $$A=\\begin{pmatrix}1&1&1\\\\1&2&0\\\\1&0&3\\end{pmatrix}$$ 顺序主子式 $\\Delta_{1}=1>0$，$\\Delta_{2}=\\begin{vmatrix}1&1\\\\1&2\\end{vmatrix}=1>0$，$\\Delta_{3}=|A|=1\\cdot6-1\\cdot3+1\\cdot(-2)=1>0$，故 $f$ 正定。","questionImages":[],"answerImages":[],"primaryChapterId":"la.chapter.quadratic_forms","secondaryChapterIds":[],"primaryProblemTypeId":"la.problem_type.quadratic_form_matrix","secondaryProblemTypeIds":[],"knowledgePointIds":["la.knowledge.positive_definite_criteria","la.knowledge.positive_definite_concept"],"methodIds":["la.method.positive_definite_definition"],"notes":"机制验证示例题（题目为项目自编，非真实真题）","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":2,"source":{"kind":"custom"}},{"id":"bank.la.4","title":"三阶范德蒙德行列式","questionText":"计算行列式 $D=\\begin{vmatrix}1&1&1\\\\1&2&4\\\\1&3&9\\end{vmatrix}$。","answerText":"范德蒙德行列式（节点 $1,2,3$）：$$D=(2-1)(3-1)(3-2)=2$$","questionImages":[],"answerImages":[],"primaryChapterId":"la.chapter.determinants","secondaryChapterIds":[],"primaryProblemTypeId":"la.problem_type.determinant_computation","secondaryProblemTypeIds":[],"knowledgePointIds":["la.knowledge.special_determinants"],"methodIds":["la.method.vandermonde_determinant"],"notes":"项目自编练习题","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":1,"source":{"kind":"custom"}},{"id":"bank.la.5","title":"二阶矩阵求逆","questionText":"求矩阵 $A=\\begin{pmatrix}3&4\\\\2&3\\end{pmatrix}$ 的逆矩阵。","answerText":"$\\det A=1\\neq 0$，$$A^{-1}=\\begin{pmatrix}3&-4\\\\-2&3\\end{pmatrix}$$","questionImages":[],"answerImages":[],"primaryChapterId":"la.chapter.matrices","secondaryChapterIds":[],"primaryProblemTypeId":"la.problem_type.inverse_matrix","secondaryProblemTypeIds":[],"knowledgePointIds":["la.knowledge.inverse_matrix"],"methodIds":["la.method.adjoint_method"],"notes":"项目自编练习题","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":1,"source":{"kind":"custom"}},{"id":"bank.la.6","title":"初等行变换求矩阵的秩","questionText":"求矩阵 $A=\\begin{pmatrix}1&2&3\\\\2&4&6\\\\1&1&1\\end{pmatrix}$ 的秩。","answerText":"第二行是第一行的 $2$ 倍，第一、三行不成比例，行阶梯化后非零行 $2$ 行，故 $r(A)=2$。","questionImages":[],"answerImages":[],"primaryChapterId":"la.chapter.matrices","secondaryChapterIds":[],"primaryProblemTypeId":"la.problem_type.matrix_rank","secondaryProblemTypeIds":[],"knowledgePointIds":["la.knowledge.matrix_rank"],"methodIds":[],"notes":"项目自编练习题","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":2,"source":{"kind":"custom"}},{"id":"bank.la.7","title":"含参数线性方程组解的讨论（经典题）","questionText":"讨论线性方程组 $\\begin{cases}x_{1}+x_{2}+\\lambda x_{3}=1\\\\ x_{1}+\\lambda x_{2}+x_{3}=\\lambda\\\\ \\lambda x_{1}+x_{2}+x_{3}=\\lambda^{2}\\end{cases}$ 解的情况，并在有解时求通解。","answerText":"系数行列式 $D=-(\\lambda-1)^{2}(\\lambda+2)$。$\\lambda\\neq1,-2$ 时有唯一解；$\\lambda=1$ 时三方程相同 $x_{1}+x_{2}+x_{3}=1$，无穷多解，通解 $(1,0,0)^{T}+k_{1}(-1,1,0)^{T}+k_{2}(-1,0,1)^{T}$；$\\lambda=-2$ 时 $r(A)=2<r(\\bar A)=3$，无解。","questionImages":[],"answerImages":[],"primaryChapterId":"la.chapter.linear_systems","secondaryChapterIds":[],"primaryProblemTypeId":"la.problem_type.system_with_parameters","secondaryProblemTypeIds":[],"knowledgePointIds":["la.knowledge.nonhomogeneous_solvability"],"methodIds":["la.method.determinant_properties"],"notes":"项目自编练习题","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":3,"source":{"kind":"custom"}},{"id":"bank.la.8","title":"下三角矩阵的特征值与可对角性","questionText":"设 $A=\\begin{pmatrix}2&0&0\\\\1&2&0\\\\0&0&3\\end{pmatrix}$，求 $A$ 的特征值，并判断 $A$ 能否相似对角化。","answerText":"下三角矩阵特征值即对角元：$\\lambda_{1}=\\lambda_{2}=2,\\ \\lambda_{3}=3$。对 $\\lambda=2$：$r(A-2E)=2$，几何重数 $1<$ 代数重数 $2$，故不能相似对角化。","questionImages":[],"answerImages":[],"primaryChapterId":"la.chapter.eigenvalues","secondaryChapterIds":[],"primaryProblemTypeId":"la.problem_type.eigenvalue_computation","secondaryProblemTypeIds":[],"knowledgePointIds":["la.knowledge.eigen_concept","la.knowledge.diagonalization_criteria"],"methodIds":["la.method.characteristic_polynomial"],"notes":"项目自编练习题","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":3,"source":{"kind":"custom"}},{"id":"bank.la.9","title":"配方法化二次型为标准形","questionText":"用配方法将二次型 $f=x_{1}^{2}+2x_{1}x_{2}+2x_{2}^{2}+4x_{2}x_{3}+4x_{3}^{2}$ 化为标准形，并写出正惯性指数与秩。","answerText":"$f=(x_{1}+x_{2})^{2}+(x_{2}+2x_{3})^{2}$。令 $y_{1}=x_{1}+x_{2},\\ y_{2}=x_{2}+2x_{3}$，标准形 $f=y_{1}^{2}+y_{2}^{2}$，正惯性指数 $p=2$，秩 $r=2$。","questionImages":[],"answerImages":[],"primaryChapterId":"la.chapter.quadratic_forms","secondaryChapterIds":[],"primaryProblemTypeId":"la.problem_type.completing_square_standard_form","secondaryProblemTypeIds":[],"knowledgePointIds":["la.knowledge.standard_form"],"methodIds":["la.method.completing_square"],"notes":"项目自编练习题","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":3,"source":{"kind":"custom"}}]},{"subject":"probability_statistics","license":"CC BY-SA 4.0","problems":[{"id":"bank.prob.1","title":"由联合分布律求期望与协方差","questionText":"设二维离散型随机变量 $(X,Y)$ 的联合分布律为 $P\\{X=0,Y=0\\}=0.2$，$P\\{X=0,Y=1\\}=0.3$，$P\\{X=1,Y=0\\}=0.3$，$P\\{X=1,Y=1\\}=0.2$。求 $E(X)$、$E(Y)$ 与 $\\operatorname{Cov}(X,Y)$。","answerText":"边缘分布得 $P\\{X=1\\}=0.5$，$P\\{Y=1\\}=0.5$，故 $E(X)=E(Y)=0.5$；$E(XY)=1\\cdot1\\cdot0.2=0.2$。$$\\operatorname{Cov}(X,Y)=E(XY)-E(X)E(Y)=0.2-0.25=-0.05$$","questionImages":[],"answerImages":[],"primaryChapterId":"prob.chapter.multidimensional_random_variables","secondaryChapterIds":[],"primaryProblemTypeId":"prob.type.expectation_calculation","secondaryProblemTypeIds":[],"knowledgePointIds":["prob.knowledge.joint_discrete_distribution","prob.knowledge.covariance"],"methodIds":["prob.method.linearity_expectation"],"notes":"机制验证示例题（题目为项目自编，非真实真题）","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":2,"source":{"kind":"exam","year":2020,"paper":"math3","number":22}},{"id":"bank.prob.2","title":"贝叶斯公式：检测结果为阳性的患病概率","questionText":"某疾病在人群中的患病率为 $1\\%$。某检测试剂对患病者呈阳性的概率为 $0.95$，对健康者呈阳性的概率为 $0.05$。现随机抽取一人检测结果为阳性，求其确实患病的概率。","answerText":"设 $A$ 表示患病，$B$ 表示阳性。由全概率公式 $$P(B)=0.01\\times0.95+0.99\\times0.05=0.059$$ 由贝叶斯公式 $$P(A\\mid B)=\\dfrac{P(A)P(B\\mid A)}{P(B)}=\\dfrac{0.0095}{0.059}\\approx0.161$$","questionImages":[],"answerImages":[],"primaryChapterId":"prob.chapter.random_events","secondaryChapterIds":[],"primaryProblemTypeId":"prob.type.conditional_probability","secondaryProblemTypeIds":[],"knowledgePointIds":["prob.knowledge.total_probability_formula"],"methodIds":["prob.method.total_probability_decomposition","prob.method.bayes_backwards"],"notes":"机制验证示例题（题目为项目自编，非真实真题）","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":2,"source":{"kind":"example","book":"Grinstead & Snell, Introduction to Probability","section":"§4.1 Conditional Probability","license":"GFDL"}},{"id":"bank.prob.3","title":"指数分布参数的最大似然估计","questionText":"设总体 $X$ 服从参数为 $\\lambda$ 的指数分布，$X_{1},\\dots,X_{n}$ 为样本，观测值为 $x_{1},\\dots,x_{n}$。求 $\\lambda$ 的最大似然估计量。","answerText":"似然函数 $L(\\lambda)=\\prod_{i=1}^{n}\\lambda\\mathrm{e}^{-\\lambda x_{i}}=\\lambda^{n}\\mathrm{e}^{-\\lambda n\\bar{x}}$。取对数 $\\ln L=n\\ln\\lambda-\\lambda n\\bar{x}$，令 $\\dfrac{\\mathrm{d}\\ln L}{\\mathrm{d}\\lambda}=\\dfrac{n}{\\lambda}-n\\bar{x}=0$，解得 $$\\hat{\\lambda}=\\dfrac{1}{\\bar{x}}$$","questionImages":[],"answerImages":[],"primaryChapterId":"prob.chapter.parameter_estimation","secondaryChapterIds":[],"primaryProblemTypeId":"prob.type.maximum_likelihood_estimation","secondaryProblemTypeIds":[],"knowledgePointIds":["prob.knowledge.maximum_likelihood_method"],"methodIds":["prob.method.maximum_likelihood_procedure"],"notes":"机制验证示例题（题目为项目自编，非真实真题）","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":2,"source":{"kind":"custom"}},{"id":"bank.prob.4","title":"古典概型：抽人问题","questionText":"从 $5$ 名男生、$3$ 名女生中随机选取 $3$ 人，求至少选出 $1$ 名女生的概率。","answerText":"对立事件“全为男生”：$\\dfrac{\\binom{5}{3}}{\\binom{8}{3}}=\\dfrac{10}{56}$，故所求为 $1-\\dfrac{10}{56}=\\dfrac{23}{28}$。","questionImages":[],"answerImages":[],"primaryChapterId":"prob.chapter.random_events","secondaryChapterIds":[],"primaryProblemTypeId":"prob.type.classical_probability","secondaryProblemTypeIds":[],"knowledgePointIds":[],"methodIds":["prob.method.permutation_combination"],"notes":"项目自编练习题","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":2,"source":{"kind":"custom"}},{"id":"bank.prob.5","title":"无放回抽取的条件概率","questionText":"一批产品共 $5$ 件，其中 $3$ 件正品、$2$ 件次品。无放回地依次取 $2$ 件，已知第 $1$ 件是正品，求第 $2$ 件也是正品的概率。","answerText":"第 $1$ 件为正品后，剩 $4$ 件中有 $2$ 件正品，故 $P=\\dfrac{2}{4}=\\dfrac{1}{2}$。","questionImages":[],"answerImages":[],"primaryChapterId":"prob.chapter.random_events","secondaryChapterIds":[],"primaryProblemTypeId":"prob.type.conditional_probability","secondaryProblemTypeIds":[],"knowledgePointIds":["prob.knowledge.conditional_probability_formula"],"methodIds":[],"notes":"项目自编练习题","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":2,"source":{"kind":"custom"}},{"id":"bank.prob.6","title":"泊松分布的概率计算","questionText":"设 $X$ 服从参数为 $1$ 的泊松分布，求 $P\\{X\\ge 2\\}$。","answerText":"$P\\{X\\ge2\\}=1-\\mathrm{e}^{-1}-\\mathrm{e}^{-1}=1-2\\mathrm{e}^{-1}\\approx0.264$。","questionImages":[],"answerImages":[],"primaryChapterId":"prob.chapter.random_variables","secondaryChapterIds":[],"primaryProblemTypeId":"prob.type.common_discrete_distributions","secondaryProblemTypeIds":[],"knowledgePointIds":["prob.knowledge.poisson_distribution"],"methodIds":[],"notes":"项目自编练习题","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":2,"source":{"kind":"custom"}},{"id":"bank.prob.7","title":"随机变量函数的期望与方差","questionText":"设 $X\\sim U(0,2)$，$Y=X^{2}$，求 $E(Y)$ 与 $D(Y)$。","answerText":"$E(Y)=\\int_{0}^{2}\\tfrac{x^{2}}{2}\\,\\mathrm{d}x=\\tfrac{4}{3}$；$E(Y^{2})=\\int_{0}^{2}\\tfrac{x^{4}}{2}\\,\\mathrm{d}x=\\tfrac{16}{5}$，故 $D(Y)=\\tfrac{16}{5}-\\tfrac{16}{9}=\\tfrac{64}{45}$。","questionImages":[],"answerImages":[],"primaryChapterId":"prob.chapter.numerical_characteristics","secondaryChapterIds":[],"primaryProblemTypeId":"prob.type.expectation_calculation","secondaryProblemTypeIds":[],"knowledgePointIds":["prob.knowledge.function_of_random_variable","prob.knowledge.variance"],"methodIds":[],"notes":"项目自编练习题","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":3,"source":{"kind":"custom"}},{"id":"bank.prob.8","title":"t 统计量的构造","questionText":"设 $X_{1},X_{2},X_{3}$ 是来自总体 $N(0,1)$ 的简单随机样本，指出 $W=\\dfrac{X_{1}}{\\sqrt{(X_{2}^{2}+X_{3}^{2})/2}}$ 服从的分布。","answerText":"$X_{1}\\sim N(0,1)$，$X_{2}^{2}+X_{3}^{2}\\sim\\chi^{2}(2)$ 且独立，由 $t$ 分布定义 $W\\sim t(2)$。","questionImages":[],"answerImages":[],"primaryChapterId":"prob.chapter.mathematical_statistics","secondaryChapterIds":[],"primaryProblemTypeId":"prob.type.normal_sampling_distribution","secondaryProblemTypeIds":[],"knowledgePointIds":["prob.knowledge.t_distribution"],"methodIds":[],"notes":"项目自编练习题","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":2,"source":{"kind":"custom"}},{"id":"bank.prob.9","title":"0-1 分布参数的最大似然估计","questionText":"设总体 $X\\sim B(1,p)$，$X_{1},\\dots,X_{n}$ 为样本，求 $p$ 的最大似然估计量。","answerText":"$L(p)=p^{n\\bar x}(1-p)^{n-n\\bar x}$，令 $\\dfrac{\\mathrm{d}\\ln L}{\\mathrm{d}p}=0$ 解得 $\\hat p=\\bar x$。","questionImages":[],"answerImages":[],"primaryChapterId":"prob.chapter.parameter_estimation","secondaryChapterIds":[],"primaryProblemTypeId":"prob.type.maximum_likelihood_estimation","secondaryProblemTypeIds":[],"knowledgePointIds":["prob.knowledge.maximum_likelihood_method"],"methodIds":["prob.method.maximum_likelihood_procedure"],"notes":"项目自编练习题","createdAt":"2026-09-27T00:00:00.000Z","attempts":[],"origin":"builtin","difficulty":2,"source":{"kind":"custom"}}]}],"bankOf":{"bank.cal.1":"calculus","bank.cal.2":"calculus","bank.cal.3":"calculus","bank.cal.4":"calculus","bank.cal.5":"calculus","bank.cal.6":"calculus","bank.cal.7":"calculus","bank.cal.8":"calculus","bank.cal.9":"calculus","bank.cal.10":"calculus","bank.cal.11":"calculus","bank.cal.12":"calculus","bank.la.1":"linear_algebra","bank.la.2":"linear_algebra","bank.la.3":"linear_algebra","bank.la.4":"linear_algebra","bank.la.5":"linear_algebra","bank.la.6":"linear_algebra","bank.la.7":"linear_algebra","bank.la.8":"linear_algebra","bank.la.9":"linear_algebra","bank.prob.1":"probability_statistics","bank.prob.2":"probability_statistics","bank.prob.3":"probability_statistics","bank.prob.4":"probability_statistics","bank.prob.5":"probability_statistics","bank.prob.6":"probability_statistics","bank.prob.7":"probability_statistics","bank.prob.8":"probability_statistics","bank.prob.9":"probability_statistics"},"chapterNames":{"function_limit_continuity":"函数、极限与连续","one_variable_differential":"一元函数微分学","one_variable_integral":"一元函数积分学","vector_algebra_and_space_analytic_geometry":"向量代数和空间解析几何","multivariable_differential":"多元函数微分学","multiple_integral":"多元函数积分学","curve_surface_integral":"曲线与曲面积分","infinite_seri const EXAM_LABEL = { math1: "数一", math2: "数二", math3: "数三" };
const SOURCE_LABEL = { exam: "真题", example: "例题", custom: "自编" };
const chapterNames = DATA.chapterNames;
let state = { subject: "all", chapter: "all", source: "all", query: "" };

const allProblems = DATA.banks.flatMap(b => b.problems);

function problemsOf(subject) { return subject === "all" ? allProblems : allProblems.filter(p => bankSubject(p) === subject); }
function bankSubject(p) { return DATA.bankOf[p.id] || ""; }

function render() {
  const stats = document.getElementById("stats");
  const counts = {};
  for (const b of DATA.banks) counts[b.subject] = (counts[b.subject] || 0) + b.problems.length;
  stats.innerHTML = DATA.subjects.map(s => `<span><strong>${counts[s.id] || 0}</strong>${s.name}</span>`).join("")
    + `<span><strong>${allProblems.length}</strong>总计</span>`;

  document.getElementById("subjectTabs").innerHTML =
    [{ id: "all", name: "全部" }, ...DATA.subjects].map(s =>
      `<button class="${state.subject === s.id ? "active" : ""}" data-subject="${s.id}">${s.name}</button>`).join("");

  const pool = problemsOf(state.subject).filter(p => state.source === "all" || (p.source && p.source.kind) === state.source)
    .filter(p => state.chapter === "all" || p.primaryChapterId === state.chapter)
    .filter(p => !state.query || (p.title + (p.questionText || "")).toLowerCase().includes(state.query.toLowerCase()));

  const chapterIds = [...new Set(problemsOf(state.subject).map(p => p.primaryChapterId))];
  document.getElementById("chapters").innerHTML =
    [{ id: "all", name: "全部章节" }, ...chapterIds.map(id => ({ id, name: chapterNames[id] || id }))]
      .map(c => `<button class="${state.chapter === c.id ? "active" : ""}" data-chapter="${c.id}">${c.name}</button>`).join("");

  const list = document.getElementById("list");
  if (!pool.length) { list.innerHTML = `<div class="empty">没有符合条件的题目</div>`; afterRender(); return; }
  list.innerHTML = pool.map(p => {
    const src = p.source || {};
    const badges = [];
    if (src.kind) badges.push(`<span class="badge ${src.kind}">${SOURCE_LABEL[src.kind] || src.kind}</span>`);
    if (src.year) badges.push(`<span class="badge exam">${src.year}${src.paper ? " · " + (EXAM_LABEL[src.paper] || src.paper) : ""}${src.number ? " · 第" + src.number + "题" : ""}</span>`);
    if (src.book) badges.push(`<span class="badge">${src.book}${src.section ? " · " + src.section : ""}${src.license ? " · " + src.license : ""}</span>`);
    if (p.origin === "builtin") badges.push(`<span class="badge builtin">内置</span>`);
    const stars = p.difficulty ? `<span class="badge">难度 ${"★".repeat(p.difficulty)}${"☆".repeat(5 - p.difficulty)}</span>` : "";
    const chapter = chapterNames[p.primaryChapterId] || p.primaryChapterId;
    const tags = [...(p.knowledgePointIds || []).map(id => DATA.kpNames[id] || id), ...(p.methodIds || []).map(id => DATA.kpNames[id] || id)];
    return `<article class="problem">
      <div class="problem-head"><h2>${esc(p.title)}</h2><div class="badges">${badges.join("")}${stars}</div></div>
      <div class="meta"><span>${esc(chapter)}</span>${tags.slice(0, 6).map(t => `<span># ${esc(t)}</span>`).join("")}</div>
      <div class="question">${esc(p.questionText || "（图片题，见 app）")}</div>
      ${p.answerText ? `<details class="answer"><summary>查看解答</summary><div class="answer-body">${esc(p.answerText)}</div></details>` : ""}
    </article>`;
  }).join("");
  afterRender();
}

function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

function afterRender() {
  if (window.renderMathInElement) {
    renderMathInElement(document.getElementById("list"), {
      delimiters: [{ left: "$$", right: "$$", display: true }, { left: "$", right: "$", display: false }],
      throwOnError: false
    });
  }
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.subject) { state.subject = b.dataset.subject; state.chapter = "all"; }
  else if (b.dataset.chapter) state.chapter = b.dataset.chapter;
  render();
});
document.getElementById("search").addEventListener("input", (e) => { state.query = e.target.value; render(); });
document.getElementById("sourceFilter").addEventListener("change", (e) => { state.source = e.target.value; render(); });

window.addEventListener("DOMContentLoaded", () => {
  // katex defer 加载完成后 auto-render 即可用；直接先渲染一次
  if (window.renderMathInElement) render(); else window.addEventListener("load", render);
});
render();
</script>
